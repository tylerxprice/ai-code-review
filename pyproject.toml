[project]
name = "ai-review"
version = "0.1.0"
description = "AI-Powered Code Review Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
ai_review = "ai_review.cli:main"

[tool.setuptools]
packages = ["ai_review"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
